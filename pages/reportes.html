<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Tacos Joya de Cerén</title>

  <!-- Bootstrap primero; los estilos propios se cargan después. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/reportes.css">
</head>
<body class="reportes-page">
  <a class="visually-hidden-focusable reportes-salto" href="#contenido-principal">
    Saltar al contenido principal
  </a>

  <div class="reportes-layout d-lg-flex">
    <!-- En escritorio queda visible; en celular se abre con el botón Menú. -->
    <aside
      class="reportes-sidebar offcanvas-lg offcanvas-start text-bg-dark d-lg-flex flex-lg-column"
      tabindex="-1"
      id="menu-lateral"
      aria-labelledby="titulo-menu"
    >
      <div class="d-flex align-items-center justify-content-between gap-3 p-4">
        <div class="d-flex align-items-center gap-3">
          <span class="reportes-marca rounded-3" aria-hidden="true">TJ</span>
          <div>
            <h2 class="h6 mb-1" id="titulo-menu">Tacos Joya</h2>
            <p class="small mb-0 text-white-50">de Cerén</p>
          </div>
        </div>
        <button
          class="btn-close btn-close-white d-lg-none"
          type="button"
          data-bs-dismiss="offcanvas"
          data-bs-target="#menu-lateral"
          aria-label="Cerrar menú"
        ></button>
      </div>

      <div class="offcanvas-body d-flex flex-column p-3">
        <nav aria-label="Navegación principal">
          <ul class="nav nav-pills flex-column gap-2">
            <li class="nav-item">
              <a class="nav-link" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="recetas.html">Recetas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="mermas.html">Mermas</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="turnos.html">Turnos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="reportes.html" aria-current="page">
                Reportes
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="abastecimientos.html">Abastecimiento</a>
            </li>
          </ul>
        </nav>

        <!-- La sesión y el nombre del usuario se integrarán en otro bloque. -->
        <div class="reportes-perfil rounded-3 p-3 mt-auto">
          <p class="small fw-semibold mb-1">Vista del dueño</p>
          <p class="small text-white-50 mb-0">Administración</p>
        </div>
      </div>
    </aside>

    <div class="reportes-area flex-grow-1">
      <header class="reportes-barra d-flex align-items-center flex-wrap gap-3 px-3 px-md-4 py-3 border-bottom">
        <button
          class="btn btn-outline-secondary d-lg-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#menu-lateral"
          aria-controls="menu-lateral"
        >
          Menú
        </button>
        <nav aria-label="Ubicación actual">
          <ol class="breadcrumb small mb-0">
            <li class="breadcrumb-item">Reportes</li>
            <li class="breadcrumb-item active" aria-current="page">Operación</li>
          </ol>
        </nav>
        <span class="badge rounded-pill text-bg-light border ms-auto">Dueño</span>
      </header>

      <main class="container-fluid p-3 p-md-4 p-xl-5" id="contenido-principal" tabindex="-1">
        <div class="row mb-4">
          <div class="col-12">
            <h1 class="h3 fw-bold mb-2">Reportes de operación</h1>
            <p class="text-body-secondary mb-0">
              Ventas, consumo, mermas y proyecciones para tomar decisiones.
            </p>
          </div>
        </div>

        <div class="reportes-contenido" id="contenido-reportes">
          <!-- Próximos bloques: filtros, indicadores y gráficas. -->
        </div>
      </main>
    </div>
  </div>

  <!-- Este script de Bootstrap controla la apertura y cierre del menú móvil. -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
</body>
</html>
