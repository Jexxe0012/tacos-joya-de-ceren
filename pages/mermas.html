<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermas | Tacos Joya de Cerén</title>

    <script src="../js/guard.js"></script>
    <script>Guard.requireLogin();</script>

    <!-- Bootstrap y estilos del proyecto -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Base compartida: colores, distribucion, botones, paneles y formularios. -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/mermas.css">
</head>
<body class="app-page" data-pagina="mermas" data-seccion="Inventario" data-rol="Empleado">
    <a class="visually-hidden-focusable app-salto" href="#contenido-principal">Saltar al contenido principal</a>

    <div class="app-layout d-lg-flex">
        <!-- Sidebar compartido del grupo que main.js rellena automáticamente -->
        <aside class="app-sidebar offcanvas-lg offcanvas-start d-lg-flex flex-lg-column" tabindex="-1" id="menu-lateral" aria-labelledby="titulo-menu"></aside>

        <div class="app-area flex-grow-1">
            <!-- Barra superior dinámica compartida -->
            <header class="app-barra d-flex align-items-center flex-wrap gap-3 px-3 px-md-4 py-3 border-bottom" id="barra-superior"></header>

            <!-- Contenido de Mermas (Tu código original sin modificaciones) -->
            <main class="top flex-grow-1 p-3 main-content" id="contenido-principal" tabindex="-1">
                

                <div class="container-fluid">
                    <h2 class="text-left pt-4">Mermas</h2>
                    <p>Indicadores de ventas, consumo, mermas y cobertura.</p>
                </div>
                    
                <div class="container-fluid indicadores">
                    <div class="row indicadores-row row-cols-1 row-cols-md-2 row-cols-lg-4">
                        <div class="col mb-3">
            <div class="card p-3 shadow-sm border-0">
                <span class="texto text-uppercase text-secondary fw-bold" style="font-size: 0.8rem;">MERMA SEMANAL</span>
                <span id="txt-merma-semanal" class="fs-2 fw-bold text-danger">0.0 kg</span>
                <span id="txt-porcentaje-limite" class="text-muted small">0% normal</span>
            </div>
        </div>
                        <div class="col mb-3">
            <div class="card p-3 shadow-sm border-0">
                <span class="texto text-uppercase text-secondary fw-bold" style="font-size: 0.8rem;">COSTO ESTIMADO</span>
                <span id="txt-costo-estimado" class="fs-2 fw-bold">$0.00</span>
                <span class="text-muted small">según precios de referencia</span>
            </div>
        </div>
                        <div class="col mb-3">
            <div class="card p-3 shadow-sm border-0">
                <span class="texto text-uppercase text-secondary fw-bold" style="font-size: 0.8rem;">INSUMO CRÍTICO</span>
                <span id="txt-insumo-critico" class="fs-2 fw-bold text-danger">Ninguno</span>
                <span id="txt-rango-insumo" class="text-danger small">0.0 kg sobre el rango</span>
            </div>
        </div>
                    </div>
                </div>

                <section class="py-2">
                    <div class="container-fluid py-4">
                        <div class="row align-items-center">
                            <div class="col-12 col-md-6">
                                <div class="card p-4 mt-3">
                                    <h2 class="login-title mb-2">Registrar Mermas</h2>
                                    <div class="section-divider"></div>
                                    <form action="" id="form-merma" class="mt-3">
                                        <div class="row">
                                            <div class="col-md-5 mb-3">
                                                <label class="login-title mb-1 item-name">Ingrediente</label>
                                                <div class=""></div>
                                                <input placeholder="" class="form-control" name="name" type="text" id="input-ingrediente">
                                            </div>
                                            <div class="col-md-5 mb-3">
                                                <label class="login-title mb-1 item-name">Cantidad</label>
                                                <div class=""></div>
                                                <input placeholder="0.0kg" class="form-control" name="name" id="input-cantidad" input type="text">
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label class="login-title mb-1 item-name">Motivo</label>
                                            <input placeholder="Preparacion excedente" class="form-control login-title" name="name" id="input-motivo">
                                        </div>
                                        <div class="mb-3">
                                            <label class="login-title mb-1 item-name">Responsable</label>
                                            <input placeholder="Nombre del responsable" class="form-control login-title" name="name" id="input-responsable">
                                        </div>
                                        <div>
                                            <label class="login-title mb-1 item-name">Observaciones</label>
                                            <input placeholder="Preparacion excedente" class="form-control login-title" name="name" id="input-observaciones">
                                        </div>
                                        <div class="d-grid mt-3">
                                            <button type="submit" class="btn btn-merma btn-lg">Guardar merma y actualizar inventario</button> 
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <div class="col-12 col-lg-6">
                                <div class="card p-4 mt-3 historial-card">
                                    <h2 class="login-title mb-2">Historial reciente</h2>
                                    <div class="section-divider"></div>
                                    
                                    <div class="table-responsive">
                                        <table class="table table-striped table-hover">
                                            <thead>
                                                <tr>
                                                    <th scope="col">Fecha</th>
                                                    <th scope="col">Ingrediente</th>
                                                    <th scope="col">cantidad</th>
                                                    <th scope="col">Estado</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tabla-historial">
                                                
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- JS de Bootstrap y Script principal del grupo -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/main.js"></script>

     <script src="../js/mermas.js"></script>
</body>
</html>
